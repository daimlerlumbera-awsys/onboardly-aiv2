version: '3.8'

services:
  db:
    image: postgres:16
    container_name: onboardly-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onboardly
    ports:
      - '5432:5432'
    volumes:
      - onboardly_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  onboardly_pg_data:
